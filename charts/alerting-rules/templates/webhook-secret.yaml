{{- if .Values.webhookSecret.create }}
# The shared secret Alertmanager presents on the webhook. The engine compares it in constant time.
#
# This lives in the monitoring namespace because that is where Alertmanager mounts it; the engine
# reads its own copy from the healops namespace. Two copies of one secret is the cost of not
# granting HealOps cross-namespace secret reads -- see the RBAC note about what is deliberately absent.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.webhookSecret.name }}
  labels:
    app.kubernetes.io/part-of: healops
type: Opaque
stringData:
  token: {{ .Values.webhookSecret.token | quote }}
{{- end }}
