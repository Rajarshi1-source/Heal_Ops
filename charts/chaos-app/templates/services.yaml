{{- range $key, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "chaos.labels" (dict "name" $svc.name "root" $) | nindent 4 }}
spec:
  selector:
    app: {{ $svc.name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
