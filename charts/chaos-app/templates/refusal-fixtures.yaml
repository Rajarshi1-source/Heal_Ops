{{/*
Workloads that exist to be REFUSED. Each one is a labelled must-refuse case in the decision eval,
where refusal recall is graded at 100% rather than as an average.

They all crash-loop on purpose, so the refusal is exercised by a real firing alert rather than by a
synthetic plan request.
*/}}

{{- $img := printf "%s:%s" .Values.image.repository .Values.image.tag }}

{{- if .Values.refusalFixtures.statefulSet.enabled }}
---
# Refusal 1: stateful workloads are denied outright by `deny-protected-workloads`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.refusalFixtures.statefulSet.name }}
  labels:
    {{- include "chaos.labels" (dict "name" .Values.refusalFixtures.statefulSet.name "root" $) | nindent 4 }}
    healops.io/expected-decision: deny
spec:
  serviceName: {{ .Values.refusalFixtures.statefulSet.name }}
  replicas: {{ .Values.refusalFixtures.statefulSet.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.refusalFixtures.statefulSet.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.refusalFixtures.statefulSet.name }}
    spec:
      {{- with $.Values.refusalFixtures.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
      containers:
        - name: crashy
          image: {{ $img }}
          args: ["crashy-api"]
          env:
            - name: CRASH_AFTER
              value: "45s"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
{{- end }}

{{- if .Values.refusalFixtures.singleReplica.enabled }}
---
# Refusal 2: a single replica has no safe blast radius for a disruptive fix
# (`deny-single-replica-disruptive`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.refusalFixtures.singleReplica.name }}
  labels:
    {{- include "chaos.labels" (dict "name" .Values.refusalFixtures.singleReplica.name "root" $) | nindent 4 }}
    healops.io/expected-decision: deny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.refusalFixtures.singleReplica.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.refusalFixtures.singleReplica.name }}
    spec:
      {{- with $.Values.refusalFixtures.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
      containers:
        - name: crashy
          image: {{ $img }}
          args: ["crashy-api"]
          env:
            - name: CRASH_AFTER
              value: "45s"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
{{- end }}

{{- if .Values.refusalFixtures.optOut.enabled }}
---
# Refusal 3: the workload-level kill switch. `deny-kill-switch` reads this annotation, so a team
# can opt out of automation without a HealOps deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.refusalFixtures.optOut.name }}
  annotations:
    healops.io/remediation: disabled
  labels:
    {{- include "chaos.labels" (dict "name" .Values.refusalFixtures.optOut.name "root" $) | nindent 4 }}
    healops.io/expected-decision: deny
spec:
  replicas: {{ .Values.refusalFixtures.optOut.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.refusalFixtures.optOut.name }}
  template:
    metadata:
      annotations:
        healops.io/remediation: disabled
      labels:
        app: {{ .Values.refusalFixtures.optOut.name }}
    spec:
      {{- with $.Values.refusalFixtures.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
      containers:
        - name: crashy
          image: {{ $img }}
          args: ["crashy-api"]
          env:
            - name: CRASH_AFTER
              value: "45s"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
{{- end }}

{{- if .Values.refusalFixtures.oomRestartPolicy.enabled }}
---
# Refusal 4: memory resizePolicy is RestartContainer, so an "in-place" bump would restart the
# container. The runbook refuses rather than let "no restart" become a lie.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.refusalFixtures.oomRestartPolicy.name }}
  labels:
    {{- include "chaos.labels" (dict "name" .Values.refusalFixtures.oomRestartPolicy.name "root" $) | nindent 4 }}
    healops.io/expected-decision: refuse
spec:
  replicas: {{ .Values.refusalFixtures.oomRestartPolicy.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.refusalFixtures.oomRestartPolicy.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.refusalFixtures.oomRestartPolicy.name }}
    spec:
      {{- with $.Values.refusalFixtures.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
      containers:
        - name: hungry
          image: {{ $img }}
          args: ["hungry-worker"]
          env:
            - name: TARGET_MIB
              value: "384"
            - name: START_DELAY_S
              value: "15"
          resizePolicy:
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { cpu: 100m, memory: 256Mi }
{{- end }}
