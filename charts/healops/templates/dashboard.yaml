{{- if .Values.dashboard.enabled }}
# The audit dashboard. Its Route Handlers proxy the engine; it holds no cluster credentials and no
# database access, so even the writable build can change nothing without the engine's approval
# path -- and the default image is the read-only build, which contains no approval control at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healops-dashboard
  labels:
    {{- include "healops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "healops.selector" "dashboard" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "healops.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "healops.podSecurity" . | nindent 8 }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: ENGINE_URL
              value: "http://{{ include "healops.engine" . }}:8000"
            {{- if and (not .Values.engine.readOnly) .Values.secrets.approvalsApiToken }}
            - name: HEALOPS_APPROVALS_API_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "healops.secret" . }}, key: HEALOPS_APPROVALS_API_TOKEN }
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext: {{- include "healops.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: healops-dashboard
  labels:
    {{- include "healops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector: {{- include "healops.selector" "dashboard" | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if and (eq .Values.dashboard.service.type "NodePort") .Values.dashboard.service.nodePort }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
{{- end }}
