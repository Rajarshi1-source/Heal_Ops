[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Migrations are forward-only and expand-contract: the additive change ships with release N, the
# destructive one waits for N+1 once no old pods remain.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is injected from HEALOPS_DATABASE_URL in migrations/env.py so the connection
# string lives in exactly one place.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
