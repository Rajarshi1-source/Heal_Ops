# Values for prometheus-community/kube-prometheus-stack, installed at a PINNED chart version
# (see KPS_CHART_VER in the Makefile). Never install this chart unpinned.

fullnameOverride: kps

# The stack ships alerts that share names with the five HealOps owns (`for: 15m`, different
# labels). The engine routes by alertname, so a duplicate would arrive as a second, late cause for
# the same incident. HealOps' rules in charts/alerting-rules are the ones that select a runbook.
defaultRules:
  disabled:
    KubePodCrashLooping: true
    KubeNodeNotReady: true

# --- Alertmanager -------------------------------------------------------------------------------
alertmanager:
  enabled: true

  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.33.1
    # HA gossip cluster: a single pod restart must not drop notifications. The cross-replica dedup
    # this enables is exactly why the HealOps webhook must be idempotent -- it is, via
    # (fingerprint, runbook, incident_id).
    replicas: 3
    nodeSelector: { healops.io/pool: platform }
    additionalArgs:
      # The UTF-8 matcher parser is the default path now; strict mode makes a config that would
      # silently fall back to the classic parser fail loudly instead.
      - name: enable-feature
        value: utf8-strict-mode
    retention: 120h
    logLevel: info
    # The shared secret the webhook receiver presents to HealOps, mounted at
    # /etc/alertmanager/secrets/healops-webhook/. It must exist BEFORE this chart installs -- an
    # Alertmanager pod cannot start without its secret volume -- so `make observability` creates
    # it first, and CI does the same.
    secrets:
      - healops-webhook

  service:
    type: NodePort
    nodePort: 30093

  config:
    global:
      resolve_timeout: 5m

    route:
      # Group by the topology HealOps correlates on, so Alertmanager's own batching lines up with
      # cause-first correlation rather than fighting it.
      group_by: ["namespace", "node", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # Only the five alerts a runbook answers reach HealOps. Everything else -- kind's TargetDown
      # noise, the stack's own alerts -- has no runbook, and would only become an escalation.
      receiver: "null"

      routes:
        # Watchdog is the stack's own liveness alert; it must never reach a runbook.
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
          continue: false

        # HealOps refuses to remediate HealOps. This is belt-and-braces: the policy file denies it
        # too, and the namespace carries healops.io/remediation=disabled.
        - matchers:
            - namespace = "healops"
          receiver: "null"
          continue: false

        - matchers:
            - alertname =~ "KubePodCrashLooping|KubePodOOMKilled|HighPodCPU|NodeDiskPressure|KubeNodeNotReady"
            - severity =~ "critical|warning"
          receiver: healops

    receivers:
      - name: "null"

      - name: healops
        webhook_configs:
          - url: http://healops-engine.healops.svc.cluster.local:8000/api/webhooks/alertmanager
            # Alertmanager batches; the receiver persists the whole batch before acknowledging.
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                # Rendered from the healops-webhook secret by the alerting-rules chart.
                credentials_file: /etc/alertmanager/secrets/healops-webhook/token

    # --- storm defence, first line ---------------------------------------------------------------
    # Engine-side correlation is the second line, because inhibition cannot express
    # owner-reference topology (a Deployment's pods) -- only label equality.
    inhibit_rules:
      # A dead node explains every pod symptom on that node. Without this, one node failure
      # becomes forty rollbacks of perfectly healthy deployments.
      - source_matchers:
          - alertname = "KubeNodeNotReady"
        target_matchers:
          - alertname =~ "KubePodCrashLooping|KubePodOOMKilled|HighPodCPU"
        equal: ["node"]

      # Disk pressure on a node explains crash loops of pods that cannot write on it.
      - source_matchers:
          - alertname = "NodeDiskPressure"
        target_matchers:
          - alertname = "KubePodCrashLooping"
        equal: ["node"]

      # A critical alert on a target suppresses the warning-level version of the same alert.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["namespace", "alertname"]

# --- Prometheus ---------------------------------------------------------------------------------
prometheus:
  service:
    type: NodePort
    nodePort: 30090

  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.11.2
    retention: 24h
    # Every observability component sits on the platform pool (k8s/kind/cluster.yaml): the chaos
    # suite kills nodes in the general pool, and a verifier whose Prometheus died with the node it
    # was judging would report "inconclusive" for the wrong reason.
    nodeSelector: { healops.io/pool: platform }
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Pick up PrometheusRule and ServiceMonitor objects from every namespace, including the
    # alerting-rules chart in `monitoring` and the HealOps engine's own /metrics in `healops`.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

# --- Grafana ------------------------------------------------------------------------------------
grafana:
  enabled: true
  nodeSelector: { healops.io/pool: platform }
  image:
    tag: 13.0.3
  adminPassword: admin
  defaultDashboardsTimezone: browser
  grafana.ini:
    users:
      default_theme: dark
  service:
    type: NodePort
    nodePort: 30030
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# --- exporters ----------------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheus-node-exporter:
  # PSI collector: "did the workload actually recover?" is answered with pressure, not just with
  # "the alert stopped firing". Beta in 1.34, GA in 1.36.
  extraArgs:
    - --collector.pressure
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
  prometheus:
    monitor:
      # Every node-exporter series names its node. Out of the box it carries only `instance` (an
      # IP:port), so the disk alert and the disk runbook's recovery check -- both scoped by `node` --
      # matched nothing at all. Found on kind: a disk cleanup that freed 60 MiB judged inconclusive.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace

kubelet:
  enabled: true
  serviceMonitor:
    # cAdvisor gives container_oom_events_total and the CFS throttling counters the verifier needs.
    cAdvisor: true
    probes: true
    resource: true

# kind runs a single-binary control plane; these scrape targets do not exist there.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# --- the rest of the stack on the platform pool, too --------------------------------------------
prometheusOperator:
  nodeSelector: { healops.io/pool: platform }
  admissionWebhooks:
    patch:
      nodeSelector: { healops.io/pool: platform }

kube-state-metrics:
  # The drain verdict reads this exporter; it must not be on a node the drain is judging.
  nodeSelector: { healops.io/pool: platform }

