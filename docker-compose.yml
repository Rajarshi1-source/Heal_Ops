# Local development stack. Every tag is pinned - see .cursor/rules/healops-core.mdc.
# The obsolete top-level `version:` key is deliberately absent; Compose v2 warns about it.

name: healops

services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    image: healops-engine:dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      HEALOPS_DATABASE_URL: postgresql+asyncpg://healops_app:healops@postgres:5432/healops
      HEALOPS_REDIS_URL: redis://redis:6379/0
      HEALOPS_ALERTMANAGER_URL: http://host.docker.internal:9093
      HEALOPS_PROMETHEUS_URL: http://host.docker.internal:9090
      HEALOPS_WEBHOOK_SHARED_SECRET: ${HEALOPS_WEBHOOK_SHARED_SECRET:-local-dev-secret}
      HEALOPS_SLACK_BOT_TOKEN: ${HEALOPS_SLACK_BOT_TOKEN:-}
      HEALOPS_SLACK_SIGNING_SECRET: ${HEALOPS_SLACK_SIGNING_SECRET:-}
      HEALOPS_APPROVALS_API_TOKEN: ${HEALOPS_APPROVALS_API_TOKEN:-}
      HEALOPS_S3_ENDPOINT: http://s3:8333
      HEALOPS_S3_BUCKET: healops-archives
      AWS_ACCESS_KEY_ID: healops
      AWS_SECRET_ACCESS_KEY: healops-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      KUBECONFIG: /home/healops/.kube/config
      HEALOPS_ENVIRONMENT: local
    volumes:
      # Read-only kubeconfig so the engine can talk to the kind cluster from the container.
      - ${KUBECONFIG_HOST:-~/.kube/config}:/home/healops/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: ./dashboard
      args:
        # Inlined at build time; a runtime env var would be ignored. The local stack is writable.
        NEXT_PUBLIC_READ_ONLY: "false"
    image: healops-dashboard:dev
    ports:
      - "3000:3000"
    depends_on:
      engine:
        condition: service_started
    environment:
      ENGINE_URL: http://engine:8000
      HEALOPS_APPROVALS_API_TOKEN: ${HEALOPS_APPROVALS_API_TOKEN:-}
      NODE_ENV: production

  postgres:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: healops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the least-privilege healops_app role before any migration runs.
      - ./engine/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Valkey ships valkey-server / valkey-cli. Do not assume redis-* symlinks exist.
    image: valkey/valkey:9.1-alpine
    ports:
      - "6379:6379"
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  s3:
    # S3-compatible object storage for the disk runbook's archive-then-delete. SeaweedFS, because
    # MinIO stopped publishing community container images, so no MinIO tag can be pinned.
    image: chrislusf/seaweedfs:4.48
    ports:
      - "8333:8333"
    environment:
      # SeaweedFS reads its admin identity from these; requests signed with anything else are refused.
      AWS_ACCESS_KEY_ID: healops
      AWS_SECRET_ACCESS_KEY: healops-dev-secret
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.0.3
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  s3_data:
